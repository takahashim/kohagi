name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # attach binaries to releases on tag pushes

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The Metal (src/fused.rs, the encoder's Metal paths) and CoreML
      # (src/coreml) backends are macOS-only and compile out otherwise, so
      # nothing above ever type-checks them. Lint them on the macOS runner.
      # Neither can run here — GitHub's macOS runners have no GPU, and CoreML
      # needs the Neural Engine — so this builds and lints but does not execute
      # the kernels.
      - if: runner.os == 'macOS'
        run: cargo clippy --locked --all-targets --features metal,coreml -- -D warnings
      # The CoreML development jigs (tools/coreml-jigs) live outside the
      # workspace so their dependencies stay out of Kohagi's Cargo.lock, which
      # also means the steps above never see them. Build and lint them here, and
      # run the blob-format unit tests, which need no Neural Engine. The jigs
      # that inspect a real model do, so they are not exercised in CI.
      - if: runner.os == 'macOS'
        working-directory: tools/coreml-jigs
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # Release binaries: Apple Silicon macOS, x86_64 Linux, and x86_64 Windows.
  # Uploaded as artifacts on every push; attached to the GitHub Release on v*
  # tags.
  #
  # The macOS binary bundles the Metal and CoreML backends so `--device metal`
  # and `--device coreml` work out of the box; both are macOS-only, so the
  # Linux binary is the CPU path alone. The Windows binary bundles Candle's
  # CUDA backend for NVIDIA GPUs; it still needs a compatible NVIDIA driver
  # and CUDA runtime at execution time.
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            features: --features metal,coreml
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ""
          # CUDA 12.4 supports the Visual Studio 2022 toolchain on this image.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            features: --features cuda
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # nvcc delegates host C++ compilation to MSVC. Load the x64 developer
      # environment so cl.exe and the Windows SDK are on PATH.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64
      # Candle compiles CUDA kernels at build time. GitHub's Windows runner has
      # no CUDA Toolkit by default, so install the same 12.4 toolkit users can
      # install locally. The runner has no GPU; this validates compilation only.
      - if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: '12.4.1'
          method: network
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}
        # Hosted runners do not expose a GPU, so Candle cannot query
        # nvidia-smi. Compile PTX for Turing (sm_75), which remains compatible
        # with newer NVIDIA architectures through driver JIT compilation.
        env:
          CUDA_COMPUTE_CAP: '80'
      - name: Smoke-test the protocol without a model (Unix)
        if: runner.os != 'Windows'
        run: |
          # Empty input must exit 0 without loading anything.
          : | ./target/${{ matrix.target }}/release/kohagi --model-path /nonexistent.safetensors --tokenizer-path /nonexistent.json
      # This runner has the CUDA Toolkit but no NVIDIA driver.  A CUDA-linked
      # executable therefore cannot be launched here, even with empty stdin;
      # the Windows job above deliberately validates compilation only.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          tar -czf dist/kohagi-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release kohagi
          cd dist && shasum -a 256 *.tar.gz > kohagi-${{ matrix.target }}.sha256
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          $archive = "kohagi-${{ matrix.target }}.zip"
          Compress-Archive -Path ".\\target\\${{ matrix.target }}\\release\\kohagi.exe" -DestinationPath ".\\dist\\$archive"
          $hash = (Get-FileHash ".\\dist\\$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content ".\\dist\\kohagi-${{ matrix.target }}.sha256" -NoNewline
      - uses: actions/upload-artifact@v7
        with:
          name: kohagi-${{ matrix.target }}
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
