[package]
name = "burnprobe"
version = "0.1.0"
edition = "2021"

[dependencies]
burn = { version = "0.21", features = ["vulkan", "ndarray", "cpu", "flex", "simd", "x86-v4", "autotune", "fusion"] }
serde_json = "1"
tokenizers = "0.21"
rayon = "1"
libm = "0.2"
candle-core = "0.11"

[profile.release]
opt-level = 3

[[bin]]
name = "fuse"
path = "src/fuse.rs"

[[bin]]
name = "gemm"
path = "src/gemm.rs"

[[bin]]
name = "real"
path = "src/real.rs"
