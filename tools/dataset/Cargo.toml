[package]
name = "kohagi-dataset"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Turns (query, text) pairs into a distillation dataset: token ids and the teacher's score"

# Deliberately outside the kohagi workspace (the root Cargo.toml excludes
# `tools`), so this stays out of kohagi's Cargo.lock and out of the published
# crate. It reads Kohagi's public API and changes nothing:
#
#     cargo run --release --manifest-path tools/dataset/Cargo.toml -- --help

[dependencies]
kohagi = { path = "../.." }
# Already in the tree through kohagi (src/cli.rs), so the derive costs nothing.
clap = { version = "4", features = ["derive"] }
tokenizers = "0.21"
serde_json = "1"
anyhow = "1"

[[bin]]
name = "kohagi-dataset"
path = "src/main.rs"
