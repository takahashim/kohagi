[workspace]
# `tools/` holds what measures and verifies Kohagi rather than what ships: the
# Python check scripts, and the macOS-only CoreML jigs. Excluded rather than made
# a member so the jigs' dependencies stay out of Kohagi's Cargo.lock; build them
# with `cargo build --manifest-path tools/coreml-jigs/Cargo.toml`.
exclude = ["tools"]

[package]
name = "kohagi"
version = "0.6.0"
edition = "2021"
rust-version = "1.89"
# ...and out of the published crate: they are for developing Kohagi, not using it.
exclude = ["tools"]
description = "Local sentence embeddings for Ruri v3 and other ModernBERT models: JSONL in, vectors out. Pure Rust, bounded memory."
license = "MIT"
repository = "https://github.com/takahashim/kohagi"
keywords = ["embeddings", "ruri", "modernbert", "candle", "jsonl"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
num_cpus = "1"
tokenizers = "0.21"
half = "2"
hf-hub = "0.4"

# The model fingerprint (src/fingerprint.rs). fnv.rs cannot do this job, being
# a 64-bit non-cryptographic hash whose only users are cache keys.
#
# 0.11 rather than the 0.10 that hf-hub already pulls in: 0.10 reaches its
# hardware backends only through its `asm` feature, which drags in sha2-asm and
# with it a C toolchain at build time. 0.11 selects the same backends by
# runtime CPU detection with no features and no build script — 1.5 GB/s instead
# of 350 MB/s on an M2, and the ARM and x86 paths both come for free. Two
# versions of sha2 in the tree is the price, and it is only build time.
sha2 = "0.11"

# candle runs pure-CPU by default; the macOS target below adds Apple Accelerate
# (AMX) for its sgemm. Apple GPU support is behind the `metal` feature — see
# `Backend` in src/model.rs for why it is opt-in rather than the default.
#
# The ModernBERT encoder lives in src/encoder.rs rather than pulling in
# candle-transformers: it is one self-contained file, and carrying it directly
# keeps Kohagi's Metal changes in the build even when installed from crates.io.
candle-core = "0.11"
candle-nn = "0.11"

# Only for the `metal` feature: Kohagi's own fused GeGLU kernel (src/fused.rs)
# dispatches through candle's Metal wrappers and needs MTLSize from objc2-metal.
# Kept semver-aligned with candle-core's pins so cargo unifies to one instance.
candle-metal-kernels = { version = "0.11", optional = true }

# Only for the `vulkan` feature: Burn is the tensor framework the Vulkan backend
# runs on, since candle has no Vulkan device (`Device` is a closed enum, so a
# backend cannot be added from outside candle-core). `cubecl` is enabled for one
# thing only — pointing the autotune cache at the user's cache directory instead
# of whatever `target/` CubeCL finds above the working directory. See
# src/vulkan/mod.rs.
burn = { version = "0.21", optional = true }

# Only for the `vulkan` feature: the platform's cache directory, for CubeCL's
# autotune results. Not hand-rolled from `XDG_CACHE_HOME`, because that answer
# is wrong on macOS; and no new entry in the lock file, since cubecl-runtime
# already depends on this exact crate for the same purpose.
dirs = { version = "6", optional = true }
objc2-metal = { version = "0.3", optional = true }

# Only for the `coreml` feature: drives the Apple Neural Engine through CoreML
# instead of candle. macOS-only (kept as plain optional deps, like the metal
# crates above, since they only build when the feature is enabled). See
# src/coreml.rs.
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = [
    "NSString", "NSURL", "NSArray", "NSDictionary", "NSValue", "NSError",
] }
objc2-core-ml = { version = "0.3", optional = true, features = [
    "MLModel", "MLModelConfiguration", "MLMultiArray", "MLFeatureValue",
    "MLFeatureProvider", "MLDictionaryFeatureProvider",
    # For the load-time shape check in src/coreml.rs: a bucket's declared
    # hidden size and sequence length are validated against the model's own
    # output constraint, so a mismatched config.json fails loudly.
    "MLModelDescription", "MLFeatureDescription", "MLMultiArrayConstraint",
] }

# Only for the `coreml-export` feature: the CoreML protobuf schema in
# src/coreml_proto is generated prost code, so the runtime crate is needed to
# encode and decode it. Not macOS-only: writing a `.mlmodel` is protobuf
# serialization and nothing else, so it builds and is tested everywhere. The
# generator (prost-build) is not a dependency — the generated code is committed,
# see src/coreml_proto/mod.rs.
prost = { version = "0.14", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["accelerate"] }


[features]
# NVIDIA GPU via Candle's CUDA backend: `cargo build --release --features cuda`,
# then `kohagi --device cuda`. Requires an NVIDIA driver and CUDA runtime.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

# Apple GPU via candle's Metal backend: `cargo build --release --features metal`,
# then `kohagi --device metal`. ~1.8x the Accelerate CPU path on an M2 at 512
# tokens; off by default because it is macOS-only and pulls in the metal crates.
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "dep:candle-metal-kernels",
    "dep:objc2-metal",
]

# Writing CoreML models from Rust instead of scripts/convert_coreml.py, behind
# its own feature because it is under development and pulls in prost.
coreml-export = ["dep:prost"]

# The Burn engine's shared machinery. Not selected directly — a device feature
# below implies it. `src/burn_engine/{encoder,weights}.rs` name no device, so
# they build for whichever devices are on.
burn-engine = ["dep:burn"]

# Any Vulkan 1.2 GPU via Burn/CubeCL, which compiles the same kernels to SPIR-V:
# `cargo build --release --features vulkan`, then `kohagi --device vulkan
# --precision f16`. Unlike `cuda` it needs no vendor runtime installed — a Mesa
# or vendor driver is enough — which is what makes AMD and Intel GPUs reachable
# at all (candle has no ROCm or Vulkan backend). `dirs` is for the autotune
# cache; `cubecl` is enabled only to point that cache somewhere sensible.
vulkan = [
    "burn-engine", "dep:dirs",
    "burn/vulkan", "burn/autotune", "burn/fusion", "burn/cubecl",
]

# The CPU through Burn's own backend rather than candle: `--device cpu-burn`.
# Transitional — it exists so the two CPU engines can be compared in one binary,
# and goes away when one of them wins.
cpu-burn = ["burn-engine", "burn/flex", "burn/simd"]

# Apple Neural Engine via CoreML: `cargo build --release --features coreml`,
# then `kohagi --device coreml`. macOS-only. Runs fixed-shape ModernBERT models
# (batch=1) from `--coreml-dir`, `--coreml-model-id`, or — with `coreml-export`
# — converted from a checkpoint on first use. See src/coreml.rs.
coreml = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-core-ml",
]

# The CoreML converter as its own binary, behind `coreml-export`. The macOS
# release build enables that feature (so `--device coreml` can convert a
# checkpoint itself), but only `kohagi` is packaged: converting to a directory is
# a publisher's one-off, not part of embedding text. See src/bin/coreml-convert.rs.
[[bin]]
name = "coreml-convert"
required-features = ["coreml-export"]

[profile.release]
lto = "thin"
