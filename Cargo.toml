[workspace]
# `tools/` holds macOS-only development jigs for the CoreML backend. Excluded
# rather than made a member so their dependencies stay out of Kohagi's
# Cargo.lock; build them with
# `cargo build --manifest-path tools/coreml-jigs/Cargo.toml`.
exclude = ["tools"]

[package]
name = "kohagi"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
# ...and out of the published crate: they are for developing Kohagi, not using it.
exclude = ["tools"]
description = "Local sentence embeddings for Ruri v3 and other ModernBERT models: JSONL in, vectors out. Pure Rust, bounded memory."
license = "MIT"
repository = "https://github.com/takahashim/kohagi"
keywords = ["embeddings", "ruri", "modernbert", "candle", "jsonl"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
num_cpus = "1"
tokenizers = "0.21"
half = "2"
hf-hub = "0.4"

# candle runs pure-CPU by default; the macOS target below adds Apple Accelerate
# (AMX) for its sgemm. Apple GPU support is behind the `metal` feature — see
# `Backend` in src/model.rs for why it is opt-in rather than the default.
#
# The ModernBERT encoder lives in src/encoder.rs rather than pulling in
# candle-transformers: it is one self-contained file, and carrying it directly
# keeps Kohagi's Metal changes in the build even when installed from crates.io.
candle-core = "0.11"
candle-nn = "0.11"

# Only for the `metal` feature: Kohagi's own fused GeGLU kernel (src/fused.rs)
# dispatches through candle's Metal wrappers and needs MTLSize from objc2-metal.
# Kept semver-aligned with candle-core's pins so cargo unifies to one instance.
candle-metal-kernels = { version = "0.11", optional = true }
objc2-metal = { version = "0.3", optional = true }

# Only for the `coreml` feature: drives the Apple Neural Engine through CoreML
# instead of candle. macOS-only (kept as plain optional deps, like the metal
# crates above, since they only build when the feature is enabled). See
# src/coreml.rs.
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = [
    "NSString", "NSURL", "NSArray", "NSDictionary", "NSValue", "NSError",
] }
objc2-core-ml = { version = "0.3", optional = true, features = [
    "MLModel", "MLModelConfiguration", "MLMultiArray", "MLFeatureValue",
    "MLFeatureProvider", "MLDictionaryFeatureProvider",
    # For the load-time shape check in src/coreml.rs: a bucket's declared
    # hidden size and sequence length are validated against the model's own
    # output constraint, so a mismatched config.json fails loudly.
    "MLModelDescription", "MLFeatureDescription", "MLMultiArrayConstraint",
] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["accelerate"] }

# Only for the `coreml-export` feature: the CoreML protobuf schema in
# src/coreml_proto is generated prost code, so the runtime crate is needed to
# encode and decode it. The generator (prost-build) is not a dependency here —
# the generated code is committed, see src/coreml_proto/mod.rs.
prost = { version = "0.14", optional = true }

[features]
# NVIDIA GPU via Candle's CUDA backend: `cargo build --release --features cuda`,
# then `kohagi --device cuda`. Requires an NVIDIA driver and CUDA runtime.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

# Apple GPU via candle's Metal backend: `cargo build --release --features metal`,
# then `kohagi --device metal`. ~1.8x the Accelerate CPU path on an M2 at 512
# tokens; off by default because it is macOS-only and pulls in the metal crates.
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "dep:candle-metal-kernels",
    "dep:objc2-metal",
]

# Writing CoreML models from Rust instead of scripts/convert_coreml.py, behind
# its own feature because it is under development and pulls in prost.
coreml-export = ["dep:prost"]

# Apple Neural Engine via CoreML: `cargo build --release --features coreml`,
# then `kohagi --device coreml`. macOS-only. Runs fixed-shape ModernBERT models
# (batch=1) from `--coreml-dir`, `--coreml-model-id`, or — with `coreml-export`
# — converted from a checkpoint on first use. See src/coreml.rs.
coreml = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-core-ml",
]

# The CoreML converter as its own binary, behind `coreml-export`. The macOS
# release build enables that feature (so `--device coreml` can convert a
# checkpoint itself), but only `kohagi` is packaged: converting to a directory is
# a publisher's one-off, not part of embedding text. See src/bin/coreml-convert.rs.
[[bin]]
name = "coreml-convert"
required-features = ["coreml-export"]

[profile.release]
lto = "thin"
